<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Book Now | Green Solutions</title>
  <meta name="description" content="Book a consultation or service with Green Solutions. Choose a time and get started on your journey toward sustainability." />
  <meta name="keywords" content="Green Solutions booking, sustainability appointment, eco services" />
  <meta name="author" content="Green Solutions" />
 

   <!-- Bootstrap CSS -->
  <link href="css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #013220;
      color: #CFCFB4;
      line-height: 1.6;
    }

    header, nav, main, footer {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #CFCFB4;
    }

    .header-left {
      text-align: left;
    }

    header h1 {
      font-size: 2.5em;
      margin: 0;
    }

    header p {
      margin: 5px 0 0;
      color: #B2AD9D;
    }

    header img {
      height: 70px;
      width: auto;
    }

    nav ul {
      list-style: none;
      padding: 0;
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    nav a {
      color: #CFCFB4;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      background-color: rgba(255,255,255,0.02);
      padding: 30px;
      border-radius: 8px;
    }

    h2 {
      color: #D9D9A0;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      font-weight: bold;
      margin-bottom: 5px;
    }

    input, select {
      padding: 10px;
      border: none;
      border-radius: 5px;
      background-color: #1e3d2f;
      color: #CFCFB4;
    }

    input::placeholder,
    select {
      color: #bfbfab;
    }

    button {
      padding: 10px 20px;
      background-color: #2f5d44;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #397554;
    }

    footer {
      text-align: center;
      border-top: 1px solid #CFCFB4;
      padding-top: 10px;
      font-size: 0.9em;
      color: #B2AD9D;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      header img {
        align-self: flex-end;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>GreenTech Solutions</h1>
      <p>Book Your Sustainable Consultation Today</p>
    </div>
    <img src="/images/GtechSol.png" alt="Green Solutions Logo" />
  </header>

  <nav>
    <ul>
      <li><a href="/index.html">Home</a></li>
      <li><a href="/about.html">About Us</a></li>
      <li><a href="/contact.html">Contact Us</a></li>
      <li><a href="/book.html">Book Now</a></li>
      <li><a href="/tips.html">Quick Tips</a></li>
    </ul>
  </nav>

  <main>
    <h2>Book a Service</h2>
    <form>
  <div class="form-group">
    <label for="fullName">Full Name</label>
    <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Your full name" required />
  </div>

  <div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" class="form-control" id="email" name="email" placeholder="you@gmail.com" required />
  </div>

  <div class="form-group">
    <label for="date">Preferred Date</label>
    <input type="date" class="form-control" id="date" name="date" required />
  </div>

  <div class="form-group">
  <label for="service">Select a Service</label>
  <select class="form-control" id="service" name="service" required>
    <option value="">-- Please choose an option --</option>
    <option value="energyAudit">Home Energy Audit</option>
    <option value="solarConsult">Solar Panel Consultation</option>
    <option value="wasteReduction">Waste Reduction Planning</option>
    <option value="greenLandscaping">Eco-Friendly Landscaping</option>
  </select>
</div>


  <button type="submit" class="btn btn-outline-light mt-2">Book Appointment</button>
</form>

  </main>

  <footer>
    <p>&copy; 2025 Green Solutions. All rights reserved.</p>
  </footer>


    <!-- jQuery library -->
     <script src="js/jquery-3.2.1.slim.min.js"></script>

    <!-- Popper -->
     <script src="js/popper.min.js"></script>

    <!-- Latest compiled and minified Bootstrap JavaScript -->
     <script src="js/bootstrap.min.js"></script>
  </body>
</html>

	

</body>
</html>
</footer>
